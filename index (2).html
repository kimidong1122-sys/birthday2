<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동윤이 생일빵 게임</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe39a;--bg2:#ff9fc0;--ink:#3a1f4d;--card:#fff;--accent:#7a3cff;--bub:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#40245e;--bg2:#8a2a5f;--ink:#fff3fa;--card:#3a2358;--bub:#fff3fa}}
:root[data-theme="dark"]{--bg1:#40245e;--bg2:#8a2a5f;--ink:#fff3fa;--card:#3a2358;--bub:#fff3fa}
html,body{height:100%;margin:0}
body{background:linear-gradient(170deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
h1{font-size:clamp(20px,5vw,30px);margin:12px 8px 2px;text-align:center}
#cnt{font-size:clamp(34px,10vw,52px);margin:0}
#sub{font-size:16px;margin:0 0 4px;opacity:.8}
#stage{position:relative;flex:1;width:100%;max-width:480px;display:flex;align-items:center;justify-content:center;min-height:0;cursor:pointer}
#dy{position:relative;height:min(62vh,420px);display:flex;align-items:flex-end;justify-content:center}
#dy img{height:100%;display:block;pointer-events:none;-webkit-user-drag:none;transition:filter .15s}
#dy.hit{animation:ouch .32s}
#dy.hit img{filter:saturate(1.8) hue-rotate(-18deg) brightness(1.05)}
@keyframes ouch{0%{transform:translate(0,0) rotate(0) scale(1)}15%{transform:translate(-18px,6px) rotate(-9deg) scale(.9,1.1)}35%{transform:translate(16px,0) rotate(8deg) scale(1.08,.92)}60%{transform:translate(-8px,0) rotate(-4deg)}100%{transform:translate(0,0) rotate(0) scale(1)}}
#dy.big.hit{animation-duration:.5s}
#bub{position:absolute;top:2%;right:4%;background:var(--bub);color:#3a1f4d;padding:8px 16px;border-radius:18px;font-size:22px;opacity:0;transform:scale(.6);transition:all .12s}
#bub.on{opacity:1;transform:scale(1)}
#anger{position:absolute;top:6%;left:10%;font-size:44px;opacity:0}
#dy.hit #anger{animation:ang .5s}
@keyframes ang{0%{opacity:1;transform:scale(.5)}60%{opacity:1;transform:scale(1.2)}100%{opacity:0}}
.fx{position:fixed;pointer-events:none;font-size:46px;animation:punch .45s forwards;z-index:5}
@keyframes punch{0%{transform:translate(-40%,-10%) scale(.4) rotate(-25deg);opacity:1}40%{transform:translate(-50%,-50%) scale(1.3) rotate(0)}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.num{position:fixed;pointer-events:none;font-size:28px;font-weight:bold;color:#e5214f;animation:fl .8s forwards;z-index:5}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
#cry{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .15s}
#dy.cry #cry{opacity:1}
#dy.cry img{filter:saturate(1.5) hue-rotate(-14deg)}
.t{position:absolute;font-size:clamp(24px,7vw,36px);animation:drip .75s infinite}
.t1{left:34%;top:50%}.t2{left:60%;top:48%;animation-delay:.2s}.t3{left:38%;top:50%;animation-delay:.4s}.t4{left:64%;top:48%;animation-delay:.55s}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(90px);opacity:0}}
#dy.cry{animation:sob .3s infinite alternate}
@keyframes sob{from{transform:translateY(0)}to{transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){.t,#dy.cry{animation:none}}
.msg{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--card);color:var(--ink);padding:10px 22px;border-radius:999px;font-size:20px;animation:msg 2.4s forwards;z-index:6;text-align:center}
@keyframes msg{0%{opacity:0;top:26%}12%{opacity:1;top:22%}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#dy.hit,#dy.hit #anger,.fx,.num{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<h1>🎂 동윤이 생일빵 🎂</h1>

const im=document.getElementById('im');im.src=IMG;
const dy=document.getElementById('dy'),bub=document.getElementById('bub'),cnt=document.getElementById('cnt'),stage=document.getElementById('stage');
const OUCH=['아야!','아!','아파!!','살살 해!','으악!','왜 때려ㅠㅠ','엄마!','생일인데...','악!','ㅠㅠ'];
const MILE={10:'🔥 10대! 아직 시작일 뿐이야',25:'👊 25대! 동윤이 얼굴이 빨개졌어',50:'🎉 50대! 동윤이가 울기 직전이야',77:'🥳 77대! 이제 케이크 먹자 🍰',100:'🎂 100대 달성! 동윤아, 생일 축하해!!'};
let n=0,bt,ct,clk=0;
function hit(x,y){
 n++;cnt.textContent=n+'대';
 const big=n%10===0;
 dy.classList.remove('hit','big');void dy.offsetWidth;dy.classList.add('hit');if(big)dy.classList.add('big');
 bub.textContent=big?'엉엉 ㅠㅠㅠ 😭':OUCH[Math.random()*OUCH.length|0];
 if(big){dy.classList.add('cry');clearTimeout(ct);ct=setTimeout(()=>dy.classList.remove('cry'),2200)}
 bub.classList.add('on');clearTimeout(bt);bt=setTimeout(()=>bub.classList.remove('on'),big?2200:700);
 const f=document.createElement('div');f.className='fx';f.textContent=big?'💥':'👊';f.style.left=x+'px';f.style.top=y+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),450);
 const m=document.createElement('div');m.className='num';m.textContent=big?'+1 크리티컬!':'+1';m.style.left=(x+20)+'px';m.style.top=(y-30)+'px';document.body.appendChild(m);setTimeout(()=>m.remove(),800);
 if(MILE[n]){const g=document.createElement('div');g.className='msg';g.textContent=MILE[n];document.body.appendChild(g);setTimeout(()=>g.remove(),2400)}
}
stage.addEventListener('pointerdown',e=>hit(e.clientX,e.clientY));
stage.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();const r=dy.getBoundingClientRect();hit(r.left+r.width/2,r.top+r.height/2)}});
</script>
